site_name: P2P Fraud Detective FR — Documentation
site_description: Vendor & Payment Integrity FR-native — détection P2P, master data, audit signé
site_url: https://ludoviclabs-dotcom.github.io/p2p-fraud-detective-fr/
repo_url: https://github.com/ludoviclabs-dotcom/p2p-fraud-detective-fr
repo_name: ludoviclabs-dotcom/p2p-fraud-detective-fr
edit_uri: edit/main/docs/

theme:
  name: material
  language: fr
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Mode clair
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Accueil: index.md
  - Architecture: architecture.md
  - Méthodologie audit: methodologie-audit.md
  - Plan d'action (audit 2026): plan-action-audit-2026.md
  - Benchmark F1: benchmark.md
  - Conformité:
      - DPIA (CNIL): compliance/dpia_template.md
      - Registre AI Act: compliance/ai_act_register.md
      - Registre RGPD: compliance/data_processing_record.md
  - Décisions (ADR):
      - 0001 — Repositionnement: decisions/0001-repositionnement-produit.md
      - 0002 — Benford rétrogradé: decisions/0002-benford-retrograde.md
      - 0003 — Streamlit + FastAPI: decisions/0003-streamlit-facade-fastapi-future.md
      - 0004 — Doublons vectorisés: decisions/0004-doublons-vectorises-rapidfuzz-cdist.md
      - 0005 — Release engineering: decisions/0005-release-engineering-semver.md
