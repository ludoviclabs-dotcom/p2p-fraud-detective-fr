version: "3.9"

services:
  # ─── API FastAPI ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: p2p-fraud-detective:0.3.0
    container_name: p2pfd_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - FRAUD_API_SECRET=${FRAUD_API_SECRET:-changeme}
      - FRAUD_CASES_DB=/app/data/cases.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - cases_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── Interface Streamlit ─────────────────────────────────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    image: p2p-fraud-detective-ui:0.3.0
    container_name: p2pfd_ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - FRAUD_API_BASE_URL=http://api:8000
    volumes:
      - cases_data:/app/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  cases_data:
    driver: local
