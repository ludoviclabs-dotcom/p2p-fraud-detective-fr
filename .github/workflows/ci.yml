name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest -q --cov=src/p2p_fraud --cov-report=term-missing

      - name: Streamlit smoke test
        run: |
          streamlit run streamlit_app.py --server.headless true --server.port 8765 &
          STREAMLIT_PID=$!
          sleep 12
          curl -fsS http://localhost:8765/_stcore/health
          curl -fsS http://localhost:8765/ -o /dev/null
          kill $STREAMLIT_PID || true
