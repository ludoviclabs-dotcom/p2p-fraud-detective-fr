name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest -q --cov=src/p2p_fraud --cov-report=term-missing

      - name: Streamlit smoke test
        run: |
          streamlit run streamlit_app.py --server.headless true --server.port 8765 &
          STREAMLIT_PID=$!
          sleep 12
          curl -fsS http://localhost:8765/_stcore/health
          curl -fsS http://localhost:8765/ -o /dev/null
          kill $STREAMLIT_PID || true

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: p2pfd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Integration tests (PostgreSQL)
        env:
          INTEGRATION_DATABASE_URL: postgresql://test:test@localhost:5432/p2pfd
        run: pytest -m integration tests/integration -v
