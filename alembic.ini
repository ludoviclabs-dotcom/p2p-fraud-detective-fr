# Alembic — configuration des migrations PostgreSQL pour P2P Fraud Detective FR
#
# Usage :
#   export DATABASE_URL=postgresql://user:pass@host:5432/p2pfd
#   alembic upgrade head        # applique les migrations
#   alembic revision -m "msg"   # crée une nouvelle migration
#   alembic downgrade -1        # rollback de 1
#
# En SQLite (démo / local), Alembic n'est pas nécessaire — le schéma est créé
# automatiquement par CaseService.SCHEMA. Les migrations Alembic ne sont
# requises qu'en PostgreSQL pour gérer l'évolution du schéma de manière contrôlée.

[alembic]
script_location = alembic
sqlalchemy.url = sqlite:///cases.db
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
